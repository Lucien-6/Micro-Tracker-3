name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install "torch>=2.1,<2.12" --index-url https://download.pytorch.org/whl/cpu
      - name: Install runtime dependencies
        run: python -m pip install "opencv-python>=4.5,<4.14" "numpy>=1.21,<2.5" "tifffile>=2024.1" "pytest>=8"
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
